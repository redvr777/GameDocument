<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A chronological photo archive, synced from GitHub.">
  <title>Photo Archive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">PHOTO ARCHIVE</p>
      <h1>Memories</h1>
      <p id="status">Loading photos…</p>
    </div>
  </header>

  <main>
    <div id="timeline" class="timeline" aria-live="polite"></div>

    <div id="empty" class="message hidden">
      <h2>No photos found</h2>
      <p>Put images in the <code>Documents</code> folder of the repo, then push them to GitHub. This page checks for new ones automatically.</p>
    </div>

    <div id="error" class="message hidden">
      <h2>Couldn’t load the archive</h2>
      <p id="error-text"></p>
    </div>
  </main>

  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button id="close-lightbox" class="close" aria-label="Close">×</button>
    <button id="prev-photo" class="nav prev" aria-label="Previous photo">‹</button>
    <figure>
      <img id="lightbox-image" src="" alt="">
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
    <button id="next-photo" class="nav next" aria-label="Next photo">›</button>
  </div>

  <!-- EXIF reader. Used only to get the original "date taken" from photos. -->
  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>
  <script src="script.js"></script>
</body>
</html>
